global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    honor_labels: true # preserve each metric's own job/instance (service.name/service.instance.id
                        # from the OTLP resource) instead of overwriting them with this scrape job's name
    static_configs:
      - targets: ["otel-collector:8889"]
