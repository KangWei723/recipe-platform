# Observability stack only: Jaeger (traces), Prometheus + Grafana (metrics).
# The four app services (Gateway/RecipeService/PantryService/SourcingService) are NOT run
# here — start them with .\start-all.ps1 as usual.
# They export OTLP to the collector below on localhost:4317.

services:
  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686" # Jaeger UI

  otel-collector:
    image: otel/opentelemetry-collector:0.105.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability-stack/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC - app services point here
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus scrape endpoint
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./observability-stack/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability-stack/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability-stack/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
